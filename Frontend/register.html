<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Trust Registration | Enterprise Security</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme_switcher.js"></script>
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">

    <!-- Theme Switcher Top Bar -->
    <div class="mb-3 text-center">
        <div class="theme-switcher-bar">
            <button type="button" class="theme-btn active" data-theme="indigo" onclick="applyTheme('indigo')">Indigo</button>
            <button type="button" class="theme-btn" data-theme="emerald" onclick="applyTheme('emerald')">Emerald</button>
            <button type="button" class="theme-btn" data-theme="platinum" onclick="applyTheme('platinum')">Platinum</button>
        </div>
    </div>

    <div class="container animate-fade-in py-3">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-panel p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-plus fa-3x mb-3" style="color: var(--accent-color);"></i>
                        <h2 class="h3 text-white">Create Account</h2>
                        <p class="text-muted small">Register for Zero Trust Access</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-white small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control glass-input border-start-0" id="username" placeholder="Choose a username" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control glass-input border-start-0" id="email" placeholder="Enter work email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white small">Role / Department</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0"><i class="fa-solid fa-graduation-cap"></i></span>
                                <select class="form-control glass-input border-start-0" id="department">
                                    <option value="Student">Student (Academic)</option>
                                    <option value="Engineering">Engineering</option>
                                    <option value="IT">IT</option>
                                    <option value="HR">HR</option>
                                    <option value="Finance">Finance</option>
                                    <option value="Guest">Guest</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-white small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text glass-input border-end-0"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control glass-input border-start-0" id="password" placeholder="Create strong password" required minlength="8">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cyber w-100 py-2 rounded-3" id="registerBtn">
                            <i class="fa-solid fa-shield-check me-2"></i> Register Securely
                        </button>
                    </form>

                    <div class="mt-4 text-center">
                        <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="text-accent text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/register.js"></script>
</body>
</html>
